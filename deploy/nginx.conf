# Nginx 反向代理配置
# 域名：himematsu.cn
#
# 部署位置：/etc/nginx/sites-available/himematsu.cn
# 启用方式：
#   sudo ln -s /etc/nginx/sites-available/himematsu.cn /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# SSL 证书申请（首次部署执行一次）：
#   sudo apt install -y certbot python3-certbot-nginx
#   sudo certbot --nginx -d himematsu.cn -d www.himematsu.cn
#   # Certbot 会自动写入 ssl_certificate 等指令并替换下方占位符

# HTTP → HTTPS 强制跳转
server {
    listen 80;
    listen [::]:80;
    server_name himematsu.cn www.himematsu.cn;

    # 允许 Certbot ACME 验证通过
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://himematsu.cn$request_uri;
    }
}

# www → 裸域名规范化跳转
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.himematsu.cn;

    # Certbot 会自动填充以下 SSL 指令
    # ssl_certificate     /etc/letsencrypt/live/himematsu.cn/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/himematsu.cn/privkey.pem;

    return 301 https://himematsu.cn$request_uri;
}

# 主站 HTTPS
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name himematsu.cn;

    # Certbot 会自动填充以下 SSL 指令
    # ssl_certificate     /etc/letsencrypt/live/himematsu.cn/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/himematsu.cn/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 安全响应头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 静态资源长期缓存（Next.js 内容哈希文件名，安全永久缓存）
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 图片资源缓存
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|woff2?)$ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=86400";
    }

    # 其余请求代理到 Next.js
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 对 SSR 页面不缓存（保证内容及时更新）
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header Cache-Control "no-store";
    }
}

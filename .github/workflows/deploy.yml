name: 部署到生产环境

on:
  push:
    branches:
      - release

# 同一时刻只允许一个部署任务运行，不取消正在进行的任务
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: 构建并部署
    runs-on: ubuntu-latest

    env:
      # 非敏感配置读取 GitHub Variables（Settings → Variables → Actions）
      # 若未设置则使用括号内的默认值
      SERVER_PORT: ${{ vars.SERVER_PORT || '22' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/var/www/web' }}
      PM2_APP_NAME: ${{ vars.PM2_APP_NAME || 'web' }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 安装全量依赖（含构建工具）
        run: npm ci

      # npm run publish = npm run sync && npm run build
      # sync 步骤从飞书拉取数据写入 src/data/，build 步骤将数据打入 .next/
      - name: 同步飞书数据并构建
        run: npm run publish
        env:
          NODE_ENV: production
          # ── 飞书必填 ──────────────────────────────────────────────
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_APP_TOKEN: ${{ secrets.FEISHU_APP_TOKEN }}
          FEISHU_TABLE_ID: ${{ secrets.FEISHU_TABLE_ID }}
          FEISHU_VIEW_ID: ${{ secrets.FEISHU_VIEW_ID }}
          # ── 飞书可选（留空则使用代码内置默认值）─────────────────────
          FEISHU_CREATION_TABLE_ID: ${{ secrets.FEISHU_CREATION_TABLE_ID }}
          FEISHU_CREATION_VIEW_ID: ${{ secrets.FEISHU_CREATION_VIEW_ID }}
          FEISHU_OSS_TABLE_ID: ${{ secrets.FEISHU_OSS_TABLE_ID }}
          FEISHU_LOCATIONS_TABLE_ID: ${{ secrets.FEISHU_LOCATIONS_TABLE_ID }}
          FEISHU_CONTRIBUTORS_TABLE_ID: ${{ secrets.FEISHU_CONTRIBUTORS_TABLE_ID }}
          # ── 阿里云 OSS 必填 ───────────────────────────────────────
          ALIYUN_OSS_REGION: ${{ secrets.ALIYUN_OSS_REGION }}
          ALIYUN_OSS_BUCKET: ${{ secrets.ALIYUN_OSS_BUCKET }}
          ALIYUN_OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
          ALIYUN_OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}

      # ── SSH 配置 ────────────────────────────────────────────────────
      - name: 配置 SSH 密钥
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: 信任服务器主机指纹
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "$SERVER_PORT" -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts

      # ── 文件传输 ────────────────────────────────────────────────────
      # 传输构建产物及运行时所需源文件；以下目录由服务器自行管理，不覆盖：
      #   runtime/  → 同步任务状态与配置
      #   logs/     → 运行日志
      #   .env*     → 下一步单独写入
      - name: 同步构建产物至服务器
        run: |
          rsync -az --delete \
            --exclude='.git/' \
            --exclude='node_modules/' \
            --exclude='runtime/' \
            --exclude='logs/' \
            --exclude='.env*' \
            --exclude='test-results/' \
            --exclude='playwright-report/' \
            --exclude='tests/' \
            --exclude='agents/' \
            --exclude='.trae/' \
            --exclude='.opencode/' \
            --exclude='web设计/' \
            --exclude='todo/' \
            --exclude='docs/' \
            --exclude='src/scripts/' \
            -e "ssh -p $SERVER_PORT" \
            ./ \
            "${{ secrets.SERVER_USERNAME }}@${{ secrets.SERVER_HOST }}:$DEPLOY_PATH/"

      # 将所有运行时环境变量写入服务器的 .env.production
      # Next.js 在生产模式下自动加载该文件；同步服务（管理后台触发）也从此读取凭据
      - name: 写入运行时环境变量
        run: |
          {
            printf 'NODE_ENV=production\n'
            printf 'PORT=3000\n'
            printf 'FEISHU_APP_ID=%s\n'                 "${FEISHU_APP_ID}"
            printf 'FEISHU_APP_SECRET=%s\n'             "${FEISHU_APP_SECRET}"
            printf 'FEISHU_APP_TOKEN=%s\n'              "${FEISHU_APP_TOKEN}"
            printf 'FEISHU_TABLE_ID=%s\n'               "${FEISHU_TABLE_ID}"
            printf 'FEISHU_VIEW_ID=%s\n'                "${FEISHU_VIEW_ID}"
            printf 'FEISHU_CREATION_TABLE_ID=%s\n'      "${FEISHU_CREATION_TABLE_ID}"
            printf 'FEISHU_CREATION_VIEW_ID=%s\n'       "${FEISHU_CREATION_VIEW_ID}"
            printf 'FEISHU_OSS_TABLE_ID=%s\n'           "${FEISHU_OSS_TABLE_ID}"
            printf 'FEISHU_LOCATIONS_TABLE_ID=%s\n'     "${FEISHU_LOCATIONS_TABLE_ID}"
            printf 'FEISHU_CONTRIBUTORS_TABLE_ID=%s\n'  "${FEISHU_CONTRIBUTORS_TABLE_ID}"
            printf 'ALIYUN_OSS_REGION=%s\n'             "${ALIYUN_OSS_REGION}"
            printf 'ALIYUN_OSS_BUCKET=%s\n'             "${ALIYUN_OSS_BUCKET}"
            printf 'ALIYUN_OSS_ACCESS_KEY_ID=%s\n'      "${ALIYUN_OSS_ACCESS_KEY_ID}"
            printf 'ALIYUN_OSS_ACCESS_KEY_SECRET=%s\n'  "${ALIYUN_OSS_ACCESS_KEY_SECRET}"
            printf 'ADMIN_PASSWORD=%s\n'                "${ADMIN_PASSWORD}"
            printf 'ADMIN_SESSION_SECRET=%s\n'          "${ADMIN_SESSION_SECRET}"
            printf 'SYNC_RESTART_COMMAND=pm2 reload %s --update-env\n' "${PM2_APP_NAME}"
            printf 'SYNC_HEALTHCHECK_URL=http://localhost:3000\n'
          } | ssh -p "$SERVER_PORT" \
            "${{ secrets.SERVER_USERNAME }}@${{ secrets.SERVER_HOST }}" \
            "cat > '$DEPLOY_PATH/.env.production'"
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_APP_TOKEN: ${{ secrets.FEISHU_APP_TOKEN }}
          FEISHU_TABLE_ID: ${{ secrets.FEISHU_TABLE_ID }}
          FEISHU_VIEW_ID: ${{ secrets.FEISHU_VIEW_ID }}
          FEISHU_CREATION_TABLE_ID: ${{ secrets.FEISHU_CREATION_TABLE_ID }}
          FEISHU_CREATION_VIEW_ID: ${{ secrets.FEISHU_CREATION_VIEW_ID }}
          FEISHU_OSS_TABLE_ID: ${{ secrets.FEISHU_OSS_TABLE_ID }}
          FEISHU_LOCATIONS_TABLE_ID: ${{ secrets.FEISHU_LOCATIONS_TABLE_ID }}
          FEISHU_CONTRIBUTORS_TABLE_ID: ${{ secrets.FEISHU_CONTRIBUTORS_TABLE_ID }}
          ALIYUN_OSS_REGION: ${{ secrets.ALIYUN_OSS_REGION }}
          ALIYUN_OSS_BUCKET: ${{ secrets.ALIYUN_OSS_BUCKET }}
          ALIYUN_OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
          ALIYUN_OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_SESSION_SECRET: ${{ secrets.ADMIN_SESSION_SECRET }}

      # ── 服务器端操作 ────────────────────────────────────────────────
      - name: 安装生产依赖
        run: |
          ssh -p "$SERVER_PORT" \
            "${{ secrets.SERVER_USERNAME }}@${{ secrets.SERVER_HOST }}" \
            "cd '$DEPLOY_PATH' && npm install --omit=dev"

      # pm2 reload 实现零停机重启；若进程不存在则首次启动
      - name: 重启应用服务
        run: |
          ssh -p "$SERVER_PORT" \
            "${{ secrets.SERVER_USERNAME }}@${{ secrets.SERVER_HOST }}" \
            "cd '$DEPLOY_PATH' && \
             (pm2 reload '$PM2_APP_NAME' --update-env 2>/dev/null || \
              pm2 start ecosystem.config.js --env production) && \
             pm2 save"

      - name: 验证部署状态
        run: |
          ssh -p "$SERVER_PORT" \
            "${{ secrets.SERVER_USERNAME }}@${{ secrets.SERVER_HOST }}" \
            "pm2 show '$PM2_APP_NAME'"
